<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust &amp; Piston</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0604; color: #e8d9b5; font-family: "Courier New", ui-monospace, monospace; overflow: hidden; }

  #wrap { position: relative; width: min(100vw, calc(100vh * 1.6)); aspect-ratio: 16 / 10; box-shadow: 0 0 60px rgba(217,164,65,.15); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<script>
'use strict';
(() => {
// =====================================================================
//  RUST & PISTON — FPS dieselpunk post-apocalyptique (raycasting)
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SW = 960, SH = 600;              // écran (HUD)
const RW = 480, RH = 300;              // résolution du rendu 3D
const off = document.createElement('canvas'); off.width = RW; off.height = RH;
const octx = off.getContext('2d');
const img = octx.createImageData(RW, RH);
const buf = new Uint32Array(img.data.buffer);
const zbuf = new Float32Array(RW);
const FOVK = 0.66, K = RW / (2 * FOVK * RH);
const FOG = [24, 15, 9], TINT = [1, .93, .8];
const FOGPACK = (255 << 24) | (FOG[2] << 16) | (FOG[1] << 8) | FOG[0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BRASS = '#d9a441', RUST = '#c0561f', STEAM = '#e8d9b5', DANGER = '#ff4a2a';

// ---------------------------------------------------------------------
//  Textures procédurales
// ---------------------------------------------------------------------
function mkTex(fn) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); fn(g);
  return new Uint32Array(g.getImageData(0, 0, 64, 64).data.buffer);
}
const tr = mulberry32(4242);
function speckle(g, n, fn, smin, smax) { for (let i = 0; i < n; i++) { const s = smin + tr() * (smax - smin); g.fillStyle = fn(); g.fillRect(tr() * 64, tr() * 64, s, s * (1 + tr() * 2.5)); } }
function rivet(g, x, y) { g.fillStyle = '#1b120c'; g.beginPath(); g.arc(x + .7, y + .9, 2.2, 0, 7); g.fill(); g.fillStyle = '#b98a4a'; g.beginPath(); g.arc(x, y, 1.9, 0, 7); g.fill(); g.fillStyle = '#f0d8a0'; g.fillRect(x - 1, y - 1, 1, 1); }
function glow(g, x, y, r, c0, c1) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function lens(g, x, y, r, col) { g.fillStyle = '#120c08'; g.beginPath(); g.arc(x, y, r + 1.3, 0, 7); g.fill(); glow(g, x, y, r, '#fff4c0', col); }

const TEX = [null];
// 1 — tôle rouillée
TEX[1] = mkTex(g => {
  g.fillStyle = '#74401f'; g.fillRect(0, 0, 64, 64);
  speckle(g, 260, () => `rgba(${110 + tr() * 80 | 0},${45 + tr() * 40 | 0},${12 + tr() * 20 | 0},${.15 + tr() * .3})`, 1, 5);
  speckle(g, 60, () => 'rgba(20,10,4,.25)', 1, 3);
  for (const ox of [0, 32]) for (const oy of [0, 32]) {
    g.fillStyle = 'rgba(255,190,120,.18)'; g.fillRect(ox + 1, oy + 1, 31, 1);
    g.fillStyle = '#2a170c'; g.fillRect(ox, oy, 32, 1.5); g.fillRect(ox, oy, 1.5, 32);
    for (const [rx, ry] of [[5, 5], [27, 5], [5, 27], [27, 27]]) { g.fillStyle = 'rgba(30,12,4,.4)'; g.fillRect(ox + rx - .5, oy + ry, 1.3, 5 + tr() * 12); rivet(g, ox + rx, oy + ry); }
  }
});
// 2 — briques suie
TEX[2] = mkTex(g => {
  g.fillStyle = '#2b2420'; g.fillRect(0, 0, 64, 64);
  for (let row = 0; row < 8; row++) for (let i = 0; i < 4; i++) {
    const x = (row % 2 ? -8 : 0) + i * 16, sh = tr();
    g.fillStyle = `rgb(${80 + sh * 40 | 0},${38 + sh * 20 | 0},${28 + sh * 14 | 0})`; g.fillRect(x + 1, row * 8 + 1, 14, 6);
    if (x < 0) g.fillRect(x + 64 + 1, row * 8 + 1, 14, 6);
  }
  speckle(g, 120, () => 'rgba(0,0,0,.25)', 1, 3);
  const gr = g.createLinearGradient(0, 0, 0, 64); gr.addColorStop(0, 'rgba(0,0,0,.5)'); gr.addColorStop(.6, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
// 3 — panneau de laiton avec jauge
TEX[3] = mkTex(g => {
  const gr = g.createLinearGradient(0, 0, 64, 64); gr.addColorStop(0, '#9a7632'); gr.addColorStop(1, '#6b4f20'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  speckle(g, 90, () => `rgba(60,110,90,${.1 + tr() * .2})`, 1, 3);
  g.strokeStyle = '#2a1c0a'; g.lineWidth = 2; g.strokeRect(1, 1, 62, 62); g.strokeStyle = 'rgba(255,230,160,.35)'; g.lineWidth = 1; g.strokeRect(4.5, 4.5, 55, 55);
  for (const [x, y] of [[8, 8], [56, 8], [8, 56], [56, 56]]) rivet(g, x, y);
  g.fillStyle = '#16100a'; g.beginPath(); g.arc(32, 32, 15, 0, 7); g.fill();
  g.fillStyle = '#d8c9a0'; g.beginPath(); g.arc(32, 32, 13, 0, 7); g.fill();
  g.strokeStyle = '#2a1c0a'; g.lineWidth = 1;
  for (let i = 0; i < 9; i++) { const a = Math.PI * (.8 + i * .055 * 4.5 / 1.1) ; g.beginPath(); g.moveTo(32 + Math.cos(a) * 9, 32 + Math.sin(a) * 9); g.lineTo(32 + Math.cos(a) * 12, 32 + Math.sin(a) * 12); g.stroke(); }
  g.strokeStyle = '#b8261a'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(32, 32); g.lineTo(40, 25); g.stroke();
  g.fillStyle = '#16100a'; g.fillRect(31, 31, 3, 3);
});
// 4 — acier ondulé + bande de danger
TEX[4] = mkTex(g => {
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#3b463f' : '#505e55'; g.fillRect(i * 4, 0, 4, 64); g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(i * 4, 0, 1, 64); }
  speckle(g, 160, () => `rgba(${90 + tr() * 60 | 0},${50 + tr() * 30 | 0},20,${.08 + tr() * .2})`, 1, 4);
  const gr = g.createLinearGradient(0, 40, 0, 64); gr.addColorStop(0, 'rgba(120,60,20,0)'); gr.addColorStop(1, 'rgba(120,60,20,.55)'); g.fillStyle = gr; g.fillRect(0, 40, 64, 24);
  g.fillStyle = '#1a1a14'; g.fillRect(0, 52, 64, 8);
  g.fillStyle = '#d2a82a'; for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(i * 8, 60); g.lineTo(i * 8 + 4, 60); g.lineTo(i * 8 + 8, 52); g.lineTo(i * 8 + 4, 52); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 64, 2);
});
// 5 — tuyauterie
TEX[5] = mkTex(g => {
  g.fillStyle = '#26221f'; g.fillRect(0, 0, 64, 64);
  speckle(g, 80, () => 'rgba(0,0,0,.35)', 1, 4);
  const pipe = (y, h, c0, c1) => { const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, c1); gr.addColorStop(.35, c0); gr.addColorStop(1, '#120d09'); g.fillStyle = gr; g.fillRect(0, y, 64, h); };
  pipe(6, 16, '#b0672e', '#e4a265'); pipe(40, 14, '#7c8078', '#b9bdb2');
  for (const x of [12, 44]) { g.fillStyle = '#3a2a1a'; g.fillRect(x, 3, 6, 22); g.fillRect(x, 37, 6, 20); g.fillStyle = 'rgba(255,220,160,.35)'; g.fillRect(x, 3, 1, 22); g.fillRect(x, 37, 1, 20); rivet(g, x + 3, 7); rivet(g, x + 3, 21); rivet(g, x + 3, 41); rivet(g, x + 3, 53); }
  g.strokeStyle = '#a8261a'; g.lineWidth = 2; g.beginPath(); g.arc(30, 31, 5, 0, 7); g.stroke(); g.beginPath(); g.moveTo(25, 31); g.lineTo(35, 31); g.moveTo(30, 26); g.lineTo(30, 36); g.stroke();
  g.fillStyle = 'rgba(230,230,220,.12)'; g.fillRect(40, 0, 3, 7); g.fillRect(41, 25, 4, 12);
});
// 6 / 7 — porte de sortie (verrouillée / ouverte)
function exitTex(col, label) {
  return mkTex(g => {
    g.fillStyle = '#2d2a26'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#1a1a14'; g.fillRect(0, 0, 64, 8); g.fillRect(0, 56, 64, 8);
    g.fillStyle = '#d2a82a'; for (let i = -1; i < 9; i++) { for (const y of [0, 56]) { g.beginPath(); g.moveTo(i * 8, y + 8); g.lineTo(i * 8 + 4, y + 8); g.lineTo(i * 8 + 8, y); g.lineTo(i * 8 + 4, y); g.fill(); } }
    g.fillStyle = '#3d3a34'; g.fillRect(6, 12, 52, 40); g.strokeStyle = '#15110d'; g.lineWidth = 2; g.strokeRect(6, 12, 52, 40);
    g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(8, 14, 48, 3);
    g.fillStyle = '#111'; g.fillRect(9, 20, 46, 12);
    g.fillStyle = col; g.font = 'bold 11px monospace'; g.textAlign = 'center'; g.fillText(label, 32, 30);
    glow(g, 32, 41, 9, col, 'rgba(0,0,0,0)'); g.fillStyle = col; g.beginPath(); g.arc(32, 41, 4, 0, 7); g.fill();
    rivet(g, 11, 48); rivet(g, 53, 48);
  });
}
TEX[6] = exitTex('#ff3a22', 'VERROU'); TEX[7] = exitTex('#69ff72', 'SORTIE');
// sol et plafond
const FLOOR = mkTex(g => {
  g.fillStyle = '#3d3830'; g.fillRect(0, 0, 64, 64);
  speckle(g, 300, () => `rgba(${tr() * 40 | 0},${tr() * 35 | 0},${tr() * 25 | 0},${.2 + tr() * .3})`, 1, 3);
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1.5; g.strokeRect(0, 0, 64, 64); g.beginPath(); g.moveTo(32, 0); g.lineTo(32, 64); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.3)'; for (let i = 0; i < 6; i++) g.fillRect(36, 38 + i * 4, 24, 2);
  g.fillStyle = 'rgba(15,10,6,.45)'; g.beginPath(); g.ellipse(14, 16, 9, 6, .5, 0, 7); g.fill();
});
const CEIL = mkTex(g => {
  g.fillStyle = '#24201b'; g.fillRect(0, 0, 64, 64);
  speckle(g, 160, () => 'rgba(0,0,0,.35)', 1, 3);
  g.fillStyle = '#322b24'; g.fillRect(0, 26, 64, 12); g.fillStyle = 'rgba(255,220,160,.12)'; g.fillRect(0, 26, 64, 1);
  g.strokeStyle = '#0d0a07'; g.lineWidth = 2; g.strokeRect(0, 0, 64, 64);
  for (const [x, y] of [[6, 6], [58, 6], [6, 58], [58, 58]]) rivet(g, x, y);
});

// ---------------------------------------------------------------------
//  Sprites procéduraux
// ---------------------------------------------------------------------
const PAL = {
  raider: { coat: '#5b4630', pants: '#3a2d22', hood: '#2a221a', mask: '#4a4a3c', lens: '#ffb12e', brass: '#c9973a', metal: '#6e4a30', bulk: 1, tank: false },
  brute:  { coat: '#6a2f1c', pants: '#2f2a26', hood: '#1a1512', mask: '#3a2b24', lens: '#ff3a1c', brass: '#b9892f', metal: '#8a8f88', bulk: 1.3, tank: true }
};
function drawHuman(g, f, P) {
  g.clearRect(0, 0, 64, 64);
  if (f === 3) {
    g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(32, 60, 27, 4, 0, 0, 7); g.fill();
    g.fillStyle = P.coat; g.fillRect(10, 50, 36, 10); g.fillStyle = P.pants; g.fillRect(44, 52, 15, 7);
    g.fillStyle = '#17100b'; g.fillRect(57, 51, 5, 9);
    g.fillStyle = P.hood; g.beginPath(); g.arc(9, 54, 7, 0, 7); g.fill(); lens(g, 8, 52, 2.4, 'rgba(120,70,20,.8)');
    g.fillStyle = '#7a1a10'; g.beginPath(); g.ellipse(26, 58, 10, 2, 0, 0, 7); g.fill();
    return;
  }
  const s = f === 0 ? 2 : f === 1 ? -2 : 0;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(32, 61, 17 * P.bulk, 3, 0, 0, 7); g.fill();
  g.save(); g.translate(32, 0); g.scale(P.bulk, 1); g.translate(-32, 0);
  g.fillStyle = P.pants; g.fillRect(23, 40, 7, 19 + s); g.fillRect(34, 40, 7, 19 - s);
  g.fillStyle = '#17100b'; g.fillRect(22, 56 + s, 9, 5); g.fillRect(33, 56 - s, 9, 5);
  if (P.tank) { for (const x of [11, 47]) { g.fillStyle = '#6f6a60'; g.fillRect(x, 10, 7, 26); g.fillStyle = P.brass; g.fillRect(x - 1, 9, 9, 3); g.fillRect(x - 1, 34, 9, 3); g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x + 1, 12, 2, 22); } }
  g.fillStyle = P.coat; g.beginPath(); g.moveTo(19, 22); g.lineTo(45, 22); g.lineTo(48, 50); g.lineTo(16, 50); g.closePath(); g.fill();
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(31, 22, 2, 28);
  g.fillStyle = '#1a120c'; g.fillRect(17, 38, 30, 3); g.fillStyle = P.brass; g.fillRect(30, 37, 5, 5);
  g.strokeStyle = '#2b1d12'; g.lineWidth = 3; g.beginPath(); g.moveTo(20, 23); g.lineTo(44, 47); g.stroke();
  g.fillStyle = P.brass; for (let i = 0; i < 5; i++) g.fillRect(22 + i * 5, 25 + i * 5, 2, 2);
  g.fillStyle = P.metal; g.beginPath(); g.ellipse(18, 24, 7, 5, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(46, 24, 7, 5, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(14, 21, 8, 1.5); g.fillRect(42, 21, 8, 1.5);
  g.fillStyle = P.coat; g.fillRect(12, 25, 7, 20);
  g.restore();
  // bras armé
  const hx = f === 2 ? 49 : 46;
  g.fillStyle = P.coat;
  if (f === 2) { g.fillRect(44, 26, 14, 7); g.fillStyle = '#22201c'; g.fillRect(55, 27, 8, 5); g.fillStyle = P.brass; g.fillRect(54, 26, 2, 7);
    glow(g, 62, 29.5, 8, '#fff6c8', 'rgba(255,120,20,0)'); }
  else { g.fillRect(hx - 1, 25, 7, 20); g.fillStyle = '#22201c'; g.fillRect(hx, 44, 9, 4); g.fillStyle = P.brass; g.fillRect(hx + 1, 44, 2, 4); }
  // tête : capuche + masque à gaz
  g.fillStyle = P.hood; g.beginPath(); g.arc(32, 14, 9, 0, 7); g.fill();
  g.fillStyle = P.mask; g.beginPath(); g.ellipse(32, 18, 6.5, 5.5, 0, 0, 7); g.fill();
  lens(g, 28, 13, 3.2, P.lens); lens(g, 36, 13, 3.2, P.lens);
  g.fillStyle = '#1a1510'; g.fillRect(22, 12, 20, 1.2);
  g.fillStyle = P.brass; g.fillRect(29, 19, 6, 7); g.fillStyle = '#1a1510'; for (let i = 0; i < 3; i++) g.fillRect(30, 20 + i * 2, 4, .8);
}
function drawAuto(g, f) {
  g.clearRect(0, 0, 64, 64);
  if (f === 3) {
    g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(32, 60, 26, 4, 0, 0, 7); g.fill();
    g.fillStyle = '#4a5249'; g.fillRect(12, 48, 30, 12); g.fillStyle = '#6b7068'; g.beginPath(); g.arc(48, 55, 6, 0, 7); g.fill();
    g.fillStyle = '#2a2a24'; g.fillRect(6, 56, 14, 3); g.fillRect(40, 44, 4, 8);
    glow(g, 22, 44, 10, 'rgba(200,200,190,.35)', 'rgba(200,200,190,0)'); glow(g, 28, 36, 8, 'rgba(200,200,190,.25)', 'rgba(200,200,190,0)');
    return;
  }
  const s = f === 0 ? 2 : f === 1 ? -2 : 0;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(32, 61, 18, 3, 0, 0, 7); g.fill();
  for (const [x, d] of [[22, s], [38, -s]]) { g.fillStyle = '#3a3f3a'; g.fillRect(x, 44, 5, 15 + d); g.fillStyle = BRASS; g.fillRect(x - 1, 50 + d / 2, 7, 3); g.fillStyle = '#23231f'; g.fillRect(x - 3, 58 + d, 11, 4); }
  g.fillStyle = '#6a7168'; g.fillRect(17, 22, 30, 24);
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(17, 22, 30, 2); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(17, 44, 30, 2);
  for (const [x, y] of [[20, 25], [44, 25], [20, 43], [44, 43]]) rivet(g, x, y);
  g.fillStyle = '#1a1510'; g.beginPath(); g.arc(32, 35, 7, 0, 7); g.fill(); glow(g, 32, 35, 6, '#fff0b0', 'rgba(255,150,40,.9)');
  g.fillStyle = '#4a4f48'; g.fillRect(38, 8, 6, 15); g.fillStyle = '#2a2a24'; g.fillRect(37, 7, 8, 3);
  glow(g, 41, 5, 5, 'rgba(210,210,200,.55)', 'rgba(210,210,200,0)'); glow(g, 44, 0, 4, 'rgba(210,210,200,.35)', 'rgba(210,210,200,0)');
  g.fillStyle = '#7a8178'; g.beginPath(); g.arc(30, 18, 8, Math.PI, 0); g.fill(); g.fillRect(22, 18, 16, 5);
  lens(g, 30, 19, 4, '#ff6a2a');
  g.fillStyle = '#4a5047'; g.fillRect(8, 24, 8, 22); g.fillStyle = BRASS; g.fillRect(9, 34, 6, 2);
  if (f === 2) { g.fillStyle = '#2a2a24'; g.fillRect(47, 27, 14, 6); g.fillStyle = '#4a5047'; g.fillRect(47, 25, 8, 10); glow(g, 62, 30, 9, '#fff6c8', 'rgba(255,120,20,0)'); }
  else { g.fillStyle = '#4a5047'; g.fillRect(48, 24, 8, 22); g.fillStyle = '#2a2a24'; g.fillRect(49, 44, 6, 8); }
}
function box(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function drawMed(g) { glow(g, 32, 46, 24, 'rgba(255,90,60,.4)', 'rgba(255,90,60,0)'); box(g, 15, 32, 34, 26, '#1d1510'); box(g, 17, 34, 30, 22, '#d7cdb4'); box(g, 29, 37, 6, 16, '#c4281c'); box(g, 23, 42, 18, 6, '#c4281c'); box(g, 15, 32, 34, 3, BRASS); box(g, 26, 28, 12, 4, '#3a2a1a'); }
function drawArmor(g) { glow(g, 32, 46, 24, 'rgba(120,200,255,.35)', 'rgba(120,200,255,0)'); g.fillStyle = '#6f7a74'; g.beginPath(); g.moveTo(14, 32); g.lineTo(50, 32); g.lineTo(46, 58); g.lineTo(18, 58); g.closePath(); g.fill(); g.fillStyle = '#9aa59c'; g.fillRect(16, 34, 32, 4); g.fillStyle = '#3a423e'; g.fillRect(29, 38, 6, 18); rivet(g, 19, 36); rivet(g, 45, 36); rivet(g, 24, 52); rivet(g, 40, 52); }
function drawBullets(g) { glow(g, 32, 46, 22, 'rgba(255,200,80,.35)', 'rgba(255,200,80,0)'); box(g, 16, 40, 32, 18, '#4a3a22'); box(g, 16, 40, 32, 4, '#2a1f10'); for (let i = 0; i < 6; i++) { box(g, 19 + i * 5, 32, 3, 9, BRASS); box(g, 19 + i * 5, 31, 3, 3, '#7a4a20'); } box(g, 20, 48, 24, 5, '#d8c9a0'); }
function drawShells(g) { glow(g, 32, 46, 22, 'rgba(255,100,60,.35)', 'rgba(255,100,60,0)'); for (let i = 0; i < 4; i++) { const x = 15 + i * 9; box(g, x, 32, 7, 20, '#a8261a'); box(g, x, 50, 7, 8, BRASS); box(g, x + 1, 33, 2, 17, 'rgba(255,255,255,.25)'); } }
function drawGunPick(kind) { return g => { glow(g, 32, 46, 26, 'rgba(255,200,80,.4)', 'rgba(255,200,80,0)'); g.fillStyle = '#23201c';
  if (kind === 'shotgun') { g.fillRect(6, 38, 50, 4); g.fillRect(6, 43, 50, 4); g.fillStyle = '#6a3f1c'; g.fillRect(36, 40, 26, 8); g.fillRect(14, 44, 18, 4); g.fillStyle = BRASS; g.fillRect(26, 36, 3, 13); }
  else { g.fillRect(4, 40, 38, 5); g.fillStyle = '#3a3a34'; g.fillRect(16, 38, 18, 9); g.fillStyle = '#6a3f1c'; g.fillRect(40, 41, 20, 8); g.fillStyle = BRASS; g.beginPath(); g.arc(28, 54, 7, 0, 7); g.fill(); g.fillStyle = '#23201c'; g.fillRect(26, 52, 4, 4); } }; }

const SPR = {
  raider: [0, 1, 2, 3].map(f => mkTex(g => drawHuman(g, f, PAL.raider))),
  brute:  [0, 1, 2, 3].map(f => mkTex(g => drawHuman(g, f, PAL.brute))),
  auto:   [0, 1, 2, 3].map(f => mkTex(g => drawAuto(g, f))),
  med: mkTex(drawMed), armor: mkTex(drawArmor), bal: mkTex(drawBullets), car: mkTex(drawShells),
  shotgun: mkTex(drawGunPick('shotgun')), smg: mkTex(drawGunPick('smg'))
};

// ---------------------------------------------------------------------
//  Audio (synthèse WebAudio)
// ---------------------------------------------------------------------
