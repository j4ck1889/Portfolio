<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: #000; border: 2px solid #444; max-width: 96vw; height: auto; touch-action: none; }
  p { margin: 0; font-size: 14px; opacity: .7; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<p>Joueur : ↑ / ↓ ou souris / doigt · Espace : démarrer / pause · Premier à 7 gagne</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, PW = 12, PH = 80, BS = 12, WIN = 7;
const player = { x: 20, y: H/2 - PH/2, s: 0 };
const ai = { x: W - 20 - PW, y: H/2 - PH/2, s: 0 };
const ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
let state = 'ready', keys = {}, msg = 'Appuie sur Espace pour jouer';

function serve(dir) {
  ball.x = W/2; ball.y = H/2;
  const a = (Math.random() - .5) * Math.PI / 3;
  const sp = 5;
  ball.vx = Math.cos(a) * sp * dir;
  ball.vy = Math.sin(a) * sp;
}
function reset() { player.s = ai.s = 0; serve(Math.random() < .5 ? 1 : -1); }

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'ready' || state === 'over') { reset(); state = 'play'; }
    else if (state === 'play') { state = 'pause'; msg = 'Pause'; }
    else if (state === 'pause') state = 'play';
  }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);

function pointer(e) {
  const r = cv.getBoundingClientRect();
  const y = (e.clientY - r.top) * (H / r.height);
  player.y = y - PH/2;
}
cv.addEventListener('pointermove', pointer);
cv.addEventListener('pointerdown', e => {
  pointer(e);
  if (state !== 'play') { if (state !== 'pause') reset(); state = 'play'; }
});

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hitPaddle(p, dir) {
  if (ball.x + BS > p.x && ball.x < p.x + PW && ball.y + BS > p.y && ball.y < p.y + PH) {
    const rel = (ball.y + BS/2 - (p.y + PH/2)) / (PH/2);
    const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
    const a = rel * Math.PI / 4;
    ball.vx = Math.cos(a) * sp * dir;
    ball.vy = Math.sin(a) * sp;
    ball.x = dir > 0 ? p.x + PW : p.x - BS;
  }
}

function update() {
  if (state !== 'play') return;
  if (keys.ArrowUp) player.y -= 7;
  if (keys.ArrowDown) player.y += 7;
  player.y = clamp(player.y, 0, H - PH);

  // IA : suit la balle avec une vitesse limitée
  const target = ball.y + BS/2 - PH/2;
  ai.y += clamp(target - ai.y, -4.5, 4.5);
  ai.y = clamp(ai.y, 0, H - PH);

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.y < 0) { ball.y = 0; ball.vy *= -1; }
  if (ball.y + BS > H) { ball.y = H - BS; ball.vy *= -1; }
  if (ball.vx < 0) hitPaddle(player, 1); else hitPaddle(ai, -1);

  if (ball.x + BS < 0) { ai.s++; point(1); }
  else if (ball.x > W) { player.s++; point(-1); }
}
function point(dir) {
  if (player.s >= WIN || ai.s >= WIN) {
    state = 'over';
    msg = (player.s >= WIN ? 'Tu as gagné !' : "L'ordinateur gagne") + ' — Espace pour rejouer';
  } else serve(dir);
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#333';
  for (let y = 0; y < H; y += 24) ctx.fillRect(W/2 - 2, y, 4, 12);
  ctx.fillStyle = '#fff';
  ctx.fillRect(player.x, player.y, PW, PH);
  ctx.fillRect(ai.x, ai.y, PW, PH);
  ctx.fillRect(ball.x, ball.y, BS, BS);
  ctx.font = 'bold 48px monospace'; ctx.textAlign = 'center';
  ctx.fillText(player.s, W/2 - 60, 60);
  ctx.fillText(ai.s, W/2 + 60, 60);
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H/2 - 40, W, 80);
    ctx.fillStyle = '#fff'; ctx.font = '24px system-ui';
    ctx.fillText(msg, W/2, H/2 + 8);
  }
}
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
