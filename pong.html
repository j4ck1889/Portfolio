<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong · Grid</title>
<style>
  :root { --cyan: #00e5ff; --orange: #ff5a1f; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at center, #06121c 0%, #02050a 70%); color: #bfefff; font-family: "Orbitron", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5em; font-weight: 700; text-transform: uppercase;
       background: linear-gradient(90deg, var(--cyan), #fff 50%, var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 0 8px rgba(0,229,255,.5)); }
  canvas { max-width: 96vw; height: auto; touch-action: none; border: 2px solid #0a2a38;
           box-shadow: -10px 0 40px -10px var(--cyan), 10px 0 40px -10px var(--orange), inset 0 0 40px rgba(0,0,0,.8); }
  p { margin: 0; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; opacity: .6; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<h1>Pong</h1>
<canvas id="c" width="800" height="500"></canvas>
<p>↑ / ↓ ou souris / doigt · Espace : démarrer / pause · Premier à 7</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, PW = 10, PH = 84, BS = 12, WIN = 7;
const CYAN = '#00e5ff', ORANGE = '#ff5a1f';
const player = { x: 24, y: H/2 - PH/2, s: 0 };
const ai = { x: W - 24 - PW, y: H/2 - PH/2, s: 0 };
const ball = { x: W/2, y: H/2, vx: 0, vy: 0, color: '#fff' };
let state = 'ready', keys = {}, msg = 'Espace pour entrer dans la grille';
let trail = [], flash = 0, flashColor = CYAN;

function serve(dir) {
  ball.x = W/2 - BS/2; ball.y = H/2 - BS/2;
  const a = (Math.random() - .5) * Math.PI / 3, sp = 5;
  ball.vx = Math.cos(a) * sp * dir; ball.vy = Math.sin(a) * sp;
  trail = [];
}
function reset() { player.s = ai.s = 0; serve(Math.random() < .5 ? 1 : -1); }

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'ready' || state === 'over') { reset(); state = 'play'; }
    else if (state === 'play') { state = 'pause'; msg = 'Pause'; }
    else if (state === 'pause') state = 'play';
  }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);

function pointer(e) {
  const r = cv.getBoundingClientRect();
  player.y = (e.clientY - r.top) * (H / r.height) - PH/2;
}
cv.addEventListener('pointermove', pointer);
cv.addEventListener('pointerdown', e => {
  pointer(e);
  if (state !== 'play') { if (state !== 'pause') reset(); state = 'play'; }
});

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hitPaddle(p, dir, color) {
  if (ball.x + BS > p.x && ball.x < p.x + PW && ball.y + BS > p.y && ball.y < p.y + PH) {
    const rel = (ball.y + BS/2 - (p.y + PH/2)) / (PH/2);
    const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14), a = rel * Math.PI / 4;
    ball.vx = Math.cos(a) * sp * dir; ball.vy = Math.sin(a) * sp;
    ball.x = dir > 0 ? p.x + PW : p.x - BS;
    ball.color = color; flash = 1; flashColor = color;
  }
}

function update() {
  flash = Math.max(0, flash - .05);
  if (state !== 'play') return;
  if (keys.ArrowUp) player.y -= 7;
  if (keys.ArrowDown) player.y += 7;
  player.y = clamp(player.y, 0, H - PH);

  const target = ball.y + BS/2 - PH/2;
  ai.y = clamp(ai.y + clamp(target - ai.y, -4.5, 4.5), 0, H - PH);

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.y < 0) { ball.y = 0; ball.vy *= -1; }
  if (ball.y + BS > H) { ball.y = H - BS; ball.vy *= -1; }
  if (ball.vx < 0) hitPaddle(player, 1, CYAN); else hitPaddle(ai, -1, ORANGE);

  trail.push({ x: ball.x + BS/2, y: ball.y + BS/2 });
  if (trail.length > 18) trail.shift();

  if (ball.x + BS < 0) { ai.s++; point(1); }
  else if (ball.x > W) { player.s++; point(-1); }
}
function point(dir) {
  if (player.s >= WIN || ai.s >= WIN) {
    state = 'over';
    msg = (player.s >= WIN ? 'Victoire' : 'Dérézzé') + ' — Espace pour rejouer';
  } else serve(dir);
}

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }

function drawGrid() {
  ctx.fillStyle = '#02070d'; ctx.fillRect(0, 0, W, H);
  // lueur de fond : cyan à gauche, orange à droite
  let g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(0,229,255,.12)'); g.addColorStop(.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(255,90,31,.12)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // grille
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) {
    ctx.strokeStyle = x < W/2 ? 'rgba(0,229,255,.13)' : 'rgba(255,90,31,.13)';
    ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    let gg = ctx.createLinearGradient(0, 0, W, 0);
    gg.addColorStop(0, 'rgba(0,229,255,.13)'); gg.addColorStop(1, 'rgba(255,90,31,.13)');
    ctx.strokeStyle = gg; ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
  }
  // ligne centrale
  ctx.save(); glow('#fff', 10); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  ctx.setLineDash([14, 12]); ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.restore();
  // murs lumineux haut / bas
  ctx.save();
  let wg = ctx.createLinearGradient(0, 0, W, 0); wg.addColorStop(0, CYAN); wg.addColorStop(1, ORANGE);
  ctx.fillStyle = wg; glow('#fff', 12); ctx.globalAlpha = .9;
  ctx.fillRect(0, 0, W, 3); ctx.fillRect(0, H - 3, W, 3); ctx.restore();
  // flash au rebond
  if (flash > 0) { ctx.fillStyle = flashColor; ctx.globalAlpha = flash * .12; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

function drawPaddle(p, color) {
  ctx.save(); glow(color, 24); ctx.fillStyle = color; ctx.fillRect(p.x, p.y, PW, PH);
  glow('#fff', 6); ctx.fillStyle = '#fff'; ctx.fillRect(p.x + PW/2 - 1, p.y + 4, 2, PH - 8);
  ctx.restore();
}

function draw() {
  drawGrid();
  // traînée de la balle
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i], k = i / trail.length;
    ctx.globalAlpha = k * .5; ctx.fillStyle = ball.color;
    ctx.fillRect(t.x - BS*k/2, t.y - BS*k/2, BS*k, BS*k);
  }
  ctx.globalAlpha = 1;
  drawPaddle(player, CYAN); drawPaddle(ai, ORANGE);
  ctx.save(); glow(ball.color, 20); ctx.fillStyle = '#fff'; ctx.fillRect(ball.x, ball.y, BS, BS); ctx.restore();

  ctx.font = 'bold 54px "Orbitron", "Segoe UI", monospace'; ctx.textAlign = 'center';
  ctx.save(); glow(CYAN, 18); ctx.fillStyle = CYAN; ctx.fillText(player.s, W/2 - 70, 66);
  glow(ORANGE, 18); ctx.fillStyle = ORANGE; ctx.fillText(ai.s, W/2 + 70, 66); ctx.restore();

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(2,7,13,.75)'; ctx.fillRect(0, H/2 - 44, W, 88);
    let bg = ctx.createLinearGradient(0, 0, W, 0); bg.addColorStop(0, CYAN); bg.addColorStop(1, ORANGE);
    ctx.fillStyle = bg; ctx.fillRect(0, H/2 - 44, W, 2); ctx.fillRect(0, H/2 + 42, W, 2);
    ctx.save(); glow('#fff', 10); ctx.fillStyle = '#fff'; ctx.font = '600 22px "Orbitron", "Segoe UI", sans-serif';
    ctx.fillText(msg.toUpperCase(), W/2, H/2 + 8); ctx.restore();
  }
}
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
